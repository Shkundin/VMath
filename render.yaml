services:
  - type: web
    name: visualmath-server
    runtime: node
    plan: starter
    rootDir: .
    autoDeployTrigger: commit
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false --prod=false && pnpm --filter @vm/shared build && pnpm --filter @vm/server build
    preDeployCommand: pnpm --filter @vm/server db:migrate
    startCommand: pnpm --filter @vm/server start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      - key: VK_APP_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WS_CORS_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
